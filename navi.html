<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 배달 네비 · MOTOVELIX</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">

  <!-- 지도 라이브러리 (Leaflet) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

  <style>
    /* ===== 브랜드 색 (메인 페이지와 같음) ===== */
    :root {
      --red: #e11d2e;
      --red-dark: #b91524;
      --navy: #0b0f16;
      --navy-2: #151b26;
      --gray: #6b7280;
      --line: #e5e7eb;
      --bg: #f4f5f7;
      --text: #111827;
      --green: #16a34a;
    }

    [hidden] {
      display: none !important;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--text);
      background-color: var(--bg);
      word-break: keep-all;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      padding: 10px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: white;
      background-color: var(--red);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: var(--red-dark);
    }

    button:disabled {
      background-color: var(--gray);
      cursor: default;
    }

    button.ghost {
      color: var(--text);
      background-color: white;
      border: 1px solid var(--line);
    }

    button.ghost:hover {
      background-color: var(--bg);
    }

    /* ===== 맨 위 줄 ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      color: white;
      background-color: var(--navy);
    }

    .logo {
      font-family: "Orbitron", sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo .x {
      color: var(--red);
    }

    .topbar .title {
      font-size: 15px;
      font-weight: 700;
    }

    .topbar .title span {
      color: var(--red);
    }

    /* ===== 화면 나누기: 왼쪽 패널 + 오른쪽 지도 ===== */
    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 380px;
      padding: 16px;
      overflow-y: auto;
      background-color: white;
      border-right: 1px solid var(--line);
    }

    #map {
      flex: 1;
      min-height: 300px;
    }

    .box h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: var(--gray);
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .hint {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--gray);
    }

    .start-name {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    /* 주소 검색 결과 */
    .results {
      margin-top: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .results div {
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
    }

    .results div:last-child {
      border-bottom: none;
    }

    .results div:hover {
      background-color: var(--bg);
    }

    /* 배달지 목록 */
    .stops {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .stops li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .stops li.done {
      opacity: 0.45;
    }

    .stops li.done .stop-name {
      text-decoration: line-through;
    }

    .num {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      font-size: 13px;
      font-weight: 900;
      color: white;
      background-color: var(--navy);
      border-radius: 50%;
    }

    .stops li.next .num {
      background-color: var(--red);
    }

    .stop-info {
      flex: 1;
      min-width: 0;
    }

    .stop-name {
      overflow: hidden;
      font-size: 14px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stop-leg {
      font-size: 12px;
      color: var(--gray);
    }

    .stop-actions {
      display: flex;
      gap: 4px;
    }

    .stop-actions a,
    .stop-actions button {
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 6px;
    }

    .stop-actions a {
      font-weight: 700;
      color: #191919;
      background-color: #fee500;
    }

    .empty {
      padding: 16px 0;
      font-size: 13px;
      text-align: center;
      color: var(--gray);
    }

    /* 합계 */
    .summary {
      display: flex;
      gap: 8px;
    }

    .summary div {
      flex: 1;
      padding: 10px;
      text-align: center;
      background-color: var(--bg);
      border-radius: 8px;
    }

    .summary b {
      display: block;
      font-size: 18px;
    }

    .summary span {
      font-size: 12px;
      color: var(--gray);
    }

    .ai-button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
    }

    .ai-note {
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      background-color: #fff1f2;
      border-left: 3px solid var(--red);
      border-radius: 6px;
    }

    /* 지도 위 번호 핀 */
    .pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      font-family: "Noto Sans KR", sans-serif;
      font-size: 13px;
      font-weight: 900;
      color: white;
      background-color: var(--navy);
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .pin.start {
      background-color: var(--green);
    }

    .pin.next {
      background-color: var(--red);
    }

    .pin.done {
      background-color: var(--gray);
    }

    /* 알림 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      z-index: 2000;
      padding: 10px 18px;
      font-size: 14px;
      color: white;
      background-color: var(--navy-2);
      border-radius: 8px;
      transform: translateX(-50%);
    }

    /* ===== 휴대폰 화면: 지도 위, 패널 아래 ===== */
    @media (max-width: 760px) {
      .layout {
        flex-direction: column-reverse;
      }

      .panel {
        width: 100%;
        max-height: 55vh;
        border-right: none;
        border-top: 1px solid var(--line);
      }

      .topbar .title {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="logo">MOTOVELI<span class="x">X</span></a>
    <div class="title"><span>AI</span> 배달 네비</div>
  </header>

  <div class="layout">
    <aside class="panel">

      <!-- 1. 출발지 -->
      <div class="box">
        <h3>① 출발지</h3>
        <div class="row">
          <button onclick="useMyLocation()">📍 내 위치</button>
          <button class="ghost" onclick="setPickMode('start')">지도에서 찍기</button>
        </div>
        <div class="start-name" id="start-name">아직 정하지 않았어요</div>
      </div>

      <!-- 2. 배달지 추가 -->
      <div class="box">
        <h3>② 배달지 추가</h3>
        <form class="row" onsubmit="searchAddress(); return false;">
          <input type="search" id="address-input" placeholder="주소나 장소 이름 (예: 강남역)">
          <button type="submit">검색</button>
        </form>
        <div class="results" id="results" hidden></div>
        <p class="hint">또는 <a href="#" onclick="setPickMode('stop'); return false;"><b>지도를 눌러서</b></a> 배달지를 바로 추가할 수 있어요.</p>
      </div>

      <!-- 3. AI 경로 계산 -->
      <button class="ai-button" id="ai-button" onclick="planRoute()">🤖 AI 최적 경로 계산</button>
      <div class="ai-note" id="ai-note" hidden></div>

      <div class="summary">
        <div><b id="total-km">-</b><span>총 거리</span></div>
        <div><b id="total-min">-</b><span>예상 시간</span></div>
        <div><b id="left-count">0</b><span>남은 배달</span></div>
      </div>

      <!-- 4. 배달 순서 -->
      <div class="box">
        <h3>③ 배달 순서</h3>
        <ul class="stops" id="stops"></ul>
        <div class="row" style="margin-top: 10px;">
          <button class="ghost" style="flex: 1;" onclick="clearDone()">완료한 곳 지우기</button>
          <button class="ghost" style="flex: 1;" onclick="clearAll()">전체 지우기</button>
        </div>
      </div>

    </aside>

    <div id="map"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    // ===== 기본 값 =====
    const BIKE_SPEED_KMH = 25;     // 길 정보가 없을 때 쓰는 오토바이 평균 속도
    const STOP_MINUTES = 3;        // 배달지 한 곳에서 머무는 시간(분)
    const SAVE_KEY = "motovelix-navi";

    let start = null;    // 출발지 { name, lat, lng }
    let stops = [];      // 배달지 [{ name, lat, lng, done, legKm, legMin }]
    let pickMode = "stop";  // 지도를 누르면 무엇을 정할지: "start" 또는 "stop"
    let routeLine = null;
    let markers = [];

    // ===== 지도 만들기 (처음엔 서울 시청) =====
    const map = L.map("map").setView([37.5665, 126.978], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    map.on("click", function (event) {
      const place = { lat: event.latlng.lat, lng: event.latlng.lng };
      if (pickMode === "start") {
        place.name = "지도에서 고른 출발지";
        setStart(place);
        pickMode = "stop";
      } else {
        place.name = "배달지 " + (stops.length + 1);
        addStop(place);
      }
    });

    // ===== 출발지 =====
    function useMyLocation() {
      if (!navigator.geolocation) {
        showToast("이 브라우저는 위치 기능을 지원하지 않아요");
        return;
      }
      showToast("내 위치를 찾는 중...");
      navigator.geolocation.getCurrentPosition(function (position) {
        setStart({ name: "내 위치", lat: position.coords.latitude, lng: position.coords.longitude });
        map.setView([start.lat, start.lng], 15);
      }, function () {
        showToast("위치를 가져오지 못했어요. 지도에서 찍어 주세요");
      }, { enableHighAccuracy: true, timeout: 10000 });
    }

    function setPickMode(mode) {
      pickMode = mode;
      showToast(mode === "start" ? "지도에서 출발지를 눌러 주세요" : "지도에서 배달지를 눌러 주세요");
    }

    function setStart(place) {
      start = place;
      clearRouteResult();
      draw();
    }

    // ===== 주소 검색 (OpenStreetMap 무료 검색) =====
    async function searchAddress() {
      const text = document.getElementById("address-input").value.trim();
      const box = document.getElementById("results");
      if (!text) return;

      box.hidden = false;
      box.innerHTML = "<div>검색 중...</div>";

      try {
        const url = "https://nominatim.openstreetmap.org/search?format=json&countrycodes=kr&limit=5&accept-language=ko&q=" + encodeURIComponent(text);
        const response = await fetch(url);
        const list = await response.json();

        if (list.length === 0) {
          box.innerHTML = "<div>결과가 없어요. 다른 이름으로 검색하거나 지도를 눌러 주세요</div>";
          return;
        }

        box.innerHTML = "";
        list.forEach(function (item) {
          const div = document.createElement("div");
          div.textContent = item.display_name;
          div.onclick = function () {
            addStop({ name: item.display_name.split(",")[0], lat: Number(item.lat), lng: Number(item.lon) });
            box.hidden = true;
            document.getElementById("address-input").value = "";
          };
          box.appendChild(div);
        });
      } catch (error) {
        box.innerHTML = "<div>검색에 실패했어요. 인터넷 연결을 확인해 주세요</div>";
      }
    }

    // ===== 배달지 =====
    function addStop(place) {
      place.done = false;
      stops.push(place);
      clearRouteResult();
      draw();
      showToast(place.name + " 추가됨");
    }

    function removeStop(index) {
      stops.splice(index, 1);
      clearRouteResult();
      draw();
    }

    function toggleDone(index) {
      stops[index].done = !stops[index].done;
      draw();
    }

    function clearDone() {
      stops = stops.filter(function (stop) { return !stop.done; });
      clearRouteResult();
      draw();
    }

    function clearAll() {
      if (!confirm("배달지를 모두 지울까요?")) return;
      stops = [];
      clearRouteResult();
      draw();
    }

    // ===== AI 최적 경로 =====
    // 1) 가장 가까운 곳부터 차례로 고르고 (최근접 이웃)
    // 2) 순서를 두 곳씩 뒤집어 보며 더 짧아지면 바꾸기 (2-opt)
    function distanceKm(a, b) {
      const R = 6371;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLng = (b.lng - a.lng) * Math.PI / 180;
      const h = Math.sin(dLat / 2) ** 2 +
        Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function pathLength(from, order) {
      let total = 0;
      let current = from;
      order.forEach(function (stop) {
        total += distanceKm(current, stop);
        current = stop;
      });
      return total;
    }

    function nearestOrder(from, list) {
      const left = list.slice();
      const order = [];
      let current = from;
      while (left.length > 0) {
        let best = 0;
        for (let i = 1; i < left.length; i++) {
          if (distanceKm(current, left[i]) < distanceKm(current, left[best])) best = i;
        }
        current = left.splice(best, 1)[0];
        order.push(current);
      }
      return order;
    }

    function improveOrder(from, order) {
      let improved = true;
      while (improved) {
        improved = false;
        for (let i = 0; i < order.length - 1; i++) {
          for (let j = i + 1; j < order.length; j++) {
            const flipped = order.slice(0, i).concat(order.slice(i, j + 1).reverse(), order.slice(j + 1));
            if (pathLength(from, flipped) < pathLength(from, order) - 0.001) {
              order = flipped;
              improved = true;
            }
          }
        }
      }
      return order;
    }

    async function planRoute() {
      const todo = stops.filter(function (stop) { return !stop.done; });
      const done = stops.filter(function (stop) { return stop.done; });

      if (!start) {
        showToast("먼저 출발지를 정해 주세요");
        return;
      }
      if (todo.length === 0) {
        showToast("배달지를 하나 이상 추가해 주세요");
        return;
      }

      const button = document.getElementById("ai-button");
      button.disabled = true;
      button.textContent = "🤖 계산 중...";

      const before = pathLength(start, todo);
      const order = improveOrder(start, nearestOrder(start, todo));
      const after = pathLength(start, order);
      stops = done.concat(order);

      // 실제 도로 경로 가져오기 (안 되면 직선으로 추정)
      const road = await fetchRoad([start].concat(order));
      order.forEach(function (stop, i) {
        if (road) {
          stop.legKm = road.legs[i].distance / 1000;
          stop.legMin = road.legs[i].duration / 60;
        } else {
          stop.legKm = distanceKm(i === 0 ? start : order[i - 1], stop) * 1.3;  // 직선보다 실제 길이 30% 정도 김
          stop.legMin = stop.legKm / BIKE_SPEED_KMH * 60;
        }
      });

      const totalKm = order.reduce(function (sum, stop) { return sum + stop.legKm; }, 0);
      const totalMin = order.reduce(function (sum, stop) { return sum + stop.legMin; }, 0) + STOP_MINUTES * order.length;

      document.getElementById("total-km").textContent = totalKm.toFixed(1) + "km";
      document.getElementById("total-min").textContent = Math.round(totalMin) + "분";

      const saved = before > 0 ? Math.round((1 - after / before) * 100) : 0;
      const note = document.getElementById("ai-note");
      note.hidden = false;
      note.innerHTML = "<b>AI 추천 완료!</b> 배달지 " + order.length + "곳을 가장 짧은 순서로 정리했어요." +
        (saved > 0 ? "<br>입력한 순서보다 이동 거리가 약 <b>" + saved + "%</b> 줄었어요." : "<br>입력한 순서가 이미 최적에 가까워요.") +
        (road ? "" : "<br><small>도로 정보를 못 불러와 거리는 직선 기준 추정치예요.</small>");

      drawRoute(road ? road.line : [start].concat(order).map(function (p) { return [p.lat, p.lng]; }));
      draw();

      button.disabled = false;
      button.textContent = "🤖 AI 최적 경로 다시 계산";
    }

    // OSRM 무료 길찾기 서버에서 도로를 따라가는 경로 받기
    async function fetchRoad(points) {
      try {
        const coords = points.map(function (p) { return p.lng + "," + p.lat; }).join(";");
        const response = await fetch("https://router.project-osrm.org/route/v1/driving/" + coords + "?overview=full&geometries=geojson");
        const data = await response.json();
        if (data.code !== "Ok") return null;
        return {
          legs: data.routes[0].legs,
          line: data.routes[0].geometry.coordinates.map(function (c) { return [c[1], c[0]]; })
        };
      } catch (error) {
        return null;
      }
    }

    function drawRoute(latlngs) {
      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline(latlngs, { color: "#e11d2e", weight: 5, opacity: 0.85 }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
    }

    function clearRouteResult() {
      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }
      stops.forEach(function (stop) {
        delete stop.legKm;
        delete stop.legMin;
      });
      document.getElementById("total-km").textContent = "-";
      document.getElementById("total-min").textContent = "-";
      document.getElementById("ai-note").hidden = true;
      document.getElementById("ai-button").textContent = "🤖 AI 최적 경로 계산";
    }

    // ===== 화면 그리기 =====
    function makePin(text, type) {
      return L.divIcon({
        className: "",
        html: "<div class='pin " + type + "'>" + text + "</div>",
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function draw() {
      markers.forEach(function (marker) { map.removeLayer(marker); });
      markers = [];

      document.getElementById("start-name").textContent = start ? "🟢 " + start.name : "아직 정하지 않았어요";
      if (start) {
        markers.push(L.marker([start.lat, start.lng], { icon: makePin("S", "start") }).addTo(map).bindTooltip("출발: " + start.name));
      }

      const nextIndex = stops.findIndex(function (stop) { return !stop.done; });
      const list = document.getElementById("stops");

      if (stops.length === 0) {
        list.innerHTML = "<li class='empty'>배달지를 추가해 주세요</li>";
      } else {
        list.innerHTML = stops.map(function (stop, i) {
          const type = stop.done ? "done" : (i === nextIndex ? "next" : "");
          const leg = stop.legKm !== undefined
            ? stop.legKm.toFixed(1) + "km · 약 " + Math.max(1, Math.round(stop.legMin)) + "분"
            : (stop.done ? "배달 완료" : "AI 계산 전");
          const kakao = "https://map.kakao.com/link/to/" + encodeURIComponent(stop.name) + "," + stop.lat + "," + stop.lng;
          return "<li class='" + type + "'>" +
            "<div class='num'>" + (i + 1) + "</div>" +
            "<div class='stop-info'><div class='stop-name'>" + escapeHtml(stop.name) + "</div>" +
            "<div class='stop-leg'>" + leg + "</div></div>" +
            "<div class='stop-actions'>" +
            "<a href='" + kakao + "' target='_blank' rel='noopener'>길안내</a>" +
            "<button onclick='toggleDone(" + i + ")'>" + (stop.done ? "취소" : "완료") + "</button>" +
            "<button class='ghost' onclick='removeStop(" + i + ")' aria-label='삭제'>✕</button>" +
            "</div></li>";
        }).join("");
      }

      stops.forEach(function (stop, i) {
        const type = stop.done ? "done" : (i === nextIndex ? "next" : "");
        markers.push(L.marker([stop.lat, stop.lng], { icon: makePin(i + 1, type) }).addTo(map).bindTooltip(stop.name));
      });

      document.getElementById("left-count").textContent = stops.filter(function (stop) { return !stop.done; }).length;
      save();
    }

    // ===== 이 기기에 저장 (새로고침해도 유지) =====
    function save() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ start: start, stops: stops }));
      } catch (error) {}
    }

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (data) {
          start = data.start;
          stops = data.stops || [];
        }
      } catch (error) {}
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function () { toast.hidden = true; }, 2000);
    }

    load();
    clearRouteResult();
    draw();
    if (start) map.setView([start.lat, start.lng], 14);
  </script>
</body>
</html>
